{% extends "base.html" %}
{% load i18n %}

{% block content %}
<section class="section bg-white min-h-[60vh] flex items-center justify-center">
    <div class="container mx-auto px-4 text-center max-w-lg">
        <div class="w-24 h-24 bg-green-100 rounded-full flex items-center justify-center text-green-500 text-4xl mx-auto mb-6">
            <i class="fas fa-check"></i>
        </div>
        <h1 class="text-4xl font-bold text-dark mb-4">{% trans "Message Envoyé !" %}</h1>
        <p class="text-gray-600 text-lg mb-8">{% trans "Merci de nous avoir contactés. Nous avons bien reçu votre message et nous vous répondrons dans les plus brefs délais." %}</p>
        <a href="{% url 'core:home' %}" class="btn btn-primary px-8">{% trans "Retour à l'accueil" %}</a>
    </div>
</section>
{% endblock %}
